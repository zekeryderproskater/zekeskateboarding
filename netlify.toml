# netlify.toml

[build]
    publish = "."

# Force HTTPS — prevents the HTTP → HTTPS redirect chain Lighthouse flags
[[redirects]]
    from = "http://masteringurbanskateboarding.netlify.app/*"
    to = "https://masteringurbanskateboarding.netlify.app/:splat"
    status = 301
    force = true

# Cache static assets for 1 year
[[headers]]
    for = "/css/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/js/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/img/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/fonts/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "SAMEORIGIN"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
